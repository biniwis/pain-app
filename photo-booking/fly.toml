# fly.toml file info
#
# See https://fly.io/docs/reference/configuration/ for information

app = "photo-booking-app" # This will be customized during the 'fly launch' command
primary_region = "fra" # Frankfurt (close to Israel)

[build]

[env]
  PORT = "3000"
  DATABASE_DIR = "/data"

[[mounts]]
  source = "booking_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]
